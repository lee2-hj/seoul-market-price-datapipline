[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataengineer"
version = "0.1.0"
description = "Data Engineering Pipeline Project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb",
    "python-dotenv",
    "requests",
    "pyarrow",
    "pyspark==4.0.4",
    "fastapi",
    "uvicorn[standard]",
    "boto3",
    "pydantic-settings",
    "elasticsearch>=8.14,<9"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src"]

[tool.pyrefly]
project-includes = ["src"]
search-path = ["src"]

# -------------------------------------------------------------------
# 데이터 엔지니어링 프로젝트 확장 설정 (TOML 중앙 관리)
# -------------------------------------------------------------------
[tool.dataengineer.paths]
config_dir = "env"
data_dir = "data"
raw_data_dir = "data/raw"
processed_data_dir = "data/processed"
logs_dir = "logs"

[tool.dataengineer.duckdb]
s3_endpoint = "192.168.0.4:9000"
# s3_access_key: <env에서 관리> (env/.env의 S3_ACCESS_KEY)
# s3_secret_key: <env에서 관리> (env/.env의 S3_SECRET_KEY)
s3_use_ssl = false
s3_url_style = "path"

[tool.dataengineer.api.seoul]
base_url = "http://openapi.seoul.go.kr:8088"
service_name = "ListNecessariesPricesService"
default_page_size = 1000
# key: <env에서 관리> (env/.env의 KEY)
